<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>איילת השדה - כניסה</title>
    <link rel="icon" href="/image/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- שעה וטמפ' -->
    <div class="top-nav">
        <div class="status-bar">
            <span id="current-time">00:00</span>
            <span class="divider">|</span>
            <span id="weather-info">☀️ טוען...</span>
        </div>
    </div>

    <form onsubmit="login(event)">
        <div class="login-container">
            <div class="login-card">

                <img src="/image/logo.png" alt="איילת השדה" class="logo">
                <h2>ברוכים הבאים!</h2>

                <div class="input-group">
                    <!-- שם משתמש -->
                    <input type="text" id="username" placeholder="הכנס שם משתמש..." autocomplete="off" required
                        pattern="[A-Za-zא-ת ]+" title="יש להזין אותיות בלבד">

                    <!-- סיסמה -->
                    <div class="pass-group">
                        <input type="password" id="password" placeholder="הכנס סיסמה..." autocomplete="current-password"
                            required>
                        <i class="bi bi-eye-slash" id="togglePassword" onclick="togglePass()"></i>
                    </div>
                </div>

                <!-- כפתור כניסה רגיל -->
                <button type="submit" id="login-btn">כניסה</button>

                <!-- כפתור כניסת אורח -->
                <button type="button" id="guest-btn" onclick="guestLogin()" class="btn-secondary">כניסה כאורח</button>

                <!-- קישור להרשמה -->
                <div class="register-link">
                    <span>עדיין אין לך חשבון?</span>
                    <a href="/html/signUp.html">להרשמה לחץ כאן</a>
                </div>

            </div>
        </div>
    </form>

    <script src="../js/login.js"></script>

</body>

</html>
