<!doctype html>
<html lang="he" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>אישור הזמנה</title>

  <link rel="icon" href="/image/favicon.png">

  <!-- Bootstrap RTL -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="/css/checkout.css">
</head>

<body>

  <div class="sticky-top" dir="ltr">
    <nav class="navbar navbar-main">
      <div class="container-fluid d-flex align-items-center justify-content-between flex-nowrap ms-4">

        <!-- שם משתמש -->
        <div class="text-white d-flex align-items-center gap-2 ms-4">
          <span id="userName"></span>
          <button class="user-btn">
            <i class="bi bi-person-circle fs-4"></i>
          </button>
        </div>

        <!-- - לוגו + שם חנות -->
        <div class="d-flex align-items-center gap-2 me-5 logo-container">
          <span class="navbar-brand mb-0 fw-bold fs-4 text-white">
            איילת השדה
          </span>
          <img src="/image/logo.png" class="rounded-circle border border-white border-1 logo-img">
        </div>

      </div>
    </nav>
  </div>



  <main class="container my-5">
    <div class="checkout-card">

      <div class="checkout-header">
        <h3>סיכום הזמנה</h3>
        <p>בדקו את הסל שלכם לפני אישור ההזמנה</p>
      </div>

      <!-- טבלת עגלה -->
      <div class="table-responsive">
        <table class="table checkout-table align-middle">
          <thead>
            <tr>
              <th></th>
              <th> מוצר </th>
              <th>כמות</th>
              <th>מחיר</th>
              <th>סה״כ</th>
              <th>מחיקה</th>
            </tr>
          </thead>
          <!-- לכאן נשלחים השורות להדפסה -->
          <tbody id="cartBody"></tbody>
        </table>
      </div>

      <!-- עגלה ריקה -->
      <div id="emptyCart" class="alert alert-warning text-center d-none">
        העגלה ריקה.
      </div>

      <!-- משלוח -->
      <section class="delivery-box">
        <h5>בחירת שיטת קבלה</h5>

        <label class="delivery-option">
          <input type="radio" name="deliveryType" value="pickup" checked onchange="toggleAddress()">
          <span><i class="bi bi-bag-check"></i> איסוף עצמי</span>
        </label>

        <label class="delivery-option">
          <input type="radio" name="deliveryType" value="delivery" onchange="toggleAddress()">
          <span><i class="bi bi-truck"></i> משלוח עד הבית</span>
        </label>

        <div id="addressBox" class="address-box d-none">
          <label class="form-label">כתובת למשלוח</label>
          <input type="text" id="deliveryAddress" class="form-control" placeholder="הכנס כתובת מלאה">
        </div>
      </section>

      <!-- סכום -->
      <div class="total-box">
        <span>סכום סופי לתשלום</span>
        <strong id="grandTotal">₪0.00</strong>
      </div>

      <button id="submitBtn" class="btn-submit">אישור הזמנה ותשלום</button>

    </div>

  </main>

  <!-- פופאפ הצלחה -->
  <div id="popup" class="popup d-none">
    <div class="popup-box">
      <h3>הזמנה אושרה ✅</h3>
      <p id="popupText"></p>
      <button onclick="closePopup()">אישור</button>
    </div>
  </div>

  <!-- פופאפ אשראי -->
  <div id="paymentPopup" class="popup d-none">
    <div class="popup-box">

      <h3>פרטי תשלום 💳</h3>

      <form id="paymentForm">

        <!-- שם -->
        <input type="text" id="cardName" class="form-control mb-2" placeholder="שם בעל הכרטיס" required
          pattern="[A-Za-z\u0590-\u05FF\s]+" title="רק אותיות בעברית או באנגלית">

        <!-- כרטיס -->
        <input type="text" id="cardNumber" class="form-control mb-2" placeholder="מספר כרטיס" required maxlength="16"
          inputmode="numeric" pattern="\d{16}" oninput="this.value=this.value.replace(/[^0-9]/g,'')">

        <!-- תז -->
        <input type="text" id="cardTz" class="form-control mb-2" placeholder="תעודת זהות" required maxlength="9"
          inputmode="numeric" pattern="\d{9}" oninput="this.value=this.value.replace(/[^0-9]/g,'')">

        <!-- תוקף -->
        <input type="text" id="cardDate" class="form-control mb-2" placeholder="MMYY" required maxlength="4"
          inputmode="numeric" pattern="(0[1-9]|1[0-2])\d{2}" oninput="this.value=this.value.replace(/[^0-9]/g,'')">

        <!-- CVV -->
        <input type="text" id="cardCvv" class="form-control mb-3" placeholder="CVV" required maxlength="3"
          inputmode="numeric" pattern="\d{3}" oninput="this.value=this.value.replace(/[^0-9]/g,'')">

        <!-- ⚠️ שינוי חשוב: submit -->
        <button type="submit" class="btn btn-success">
          שלם עכשיו
        </button>

        <button type="button" onclick="closePaymentPopup()" class="btn btn-secondary">
          ביטול
        </button>

      </form>

    </div>
  </div>

  <!-- סדר חשוב -->
  <script src="/js/storage.js"></script>
  <script src="/js/shop.js"></script>
  <script src="/js/order.js"></script>

</body>

</html>
