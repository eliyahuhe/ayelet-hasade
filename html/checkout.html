
<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>אישור הזמנה</title>

  <link rel="icon" href="/image/favicon.png">

  <!-- Bootstrap RTL -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSS של העמוד -->
  <link rel="stylesheet" href="/css/checkout.css">
</head>

<body>

  <main class="container my-5">
    <div class="checkout-card">

      <!-- כותרת העמוד -->
      <div class="checkout-header">
        <h3>סיכום הזמנה</h3>
        <p>בדקו את הסל שלכם לפני אישור ההזמנה</p>
      </div>

      <!-- טבלת מוצרים -->
      <div class="table-responsive">
        <table class="table checkout-table align-middle">
          <thead>
            <tr>
              <th>מוצר</th>
              <th>כמות</th>
              <th>מחיר</th>
              <th>סה״כ</th>
              <th>מחיקה</th>
            </tr>
          </thead>

          <tbody id="cartBody"></tbody>
        </table>
      </div>

      <!-- הודעה אם העגלה ריקה -->
      <div id="emptyCart" class="alert alert-warning text-center d-none">
        העגלה ריקה.
      </div>

      <!-- בחירת שיטת קבלה -->
      <section class="delivery-box">
        <h5>בחירת שיטת קבלה</h5>

        <!-- איסוף עצמי -->
        <label class="delivery-option">
          <input
            type="radio"
            name="deliveryType"
            value="pickup"
            checked
            onchange="toggleAddress()">
          <span>
            <i class="bi bi-bag-check"></i>
            איסוף עצמי
          </span>
        </label>

        <!-- משלוח עד הבית -->
        <label class="delivery-option">
          <input
            type="radio"
            name="deliveryType"
            value="delivery"
            onchange="toggleAddress()">
          <span>
            <i class="bi bi-truck"></i>
            משלוח עד הבית
          </span>
        </label>

        <!-- שדה כתובת שמופיע רק במשלוח -->
        <div id="addressBox" class="address-box d-none">
          <label for="deliveryAddress" class="form-label">
            כתובת למשלוח
          </label>

          <input
            type="text"
            id="deliveryAddress"
            class="form-control"
            placeholder="הכנס כתובת מלאה">
        </div>
      </section>

      <!-- סכום סופי -->
      <div class="total-box">
        <span>סכום סופי לתשלום</span>
        <strong id="grandTotal">₪0.00</strong>
      </div>

      <!-- אישור הזמנה -->
      <button id="submitBtn" class="btn-submit">
        אישור הזמנה
      </button>

    </div>
  </main>

  <!-- פופאפ אישור הזמנה -->
  <div id="popup" class="popup d-none">
    <div class="popup-box">
      <h3>הזמנה אושרה ✅</h3>
      <p id="popupText"></p>
      <button onclick="closePopup()">אישור</button>
    </div>
  </div>

  <!-- חשוב: data.js לפני order.js -->
  <script src="/js/data.js"></script>
  <script src="/js/order.js"></script>

</body>
</html>
