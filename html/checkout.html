<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>אישור הזמנה</title>

  <!-- ספריית Bootstrapה לעיצוב בסיסי שומש על ידי -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

  <!-- קובץ העיצוב שלנו -->
  <link rel="stylesheet" href="/css/checkout.css">
</head>

<body>

  <div class="container my-5">
    <div class="card custom-card">
      <div class="card-body">

        <!-- כותרת -->
        <h4 class="text-center">סיכום הזמנה 🛒</h4>

        <!-- טבלת מוצרים -->
        <table class="table mt-3">
          <thead>
            <tr>
              <th>מוצר</th>
              <th>כמות</th>
              <th>מחיר</th>
              <th>סה״כ</th>
            </tr>
          </thead>
          <tbody id="cartBody"></tbody>
        </table>

        <!-- סכום -->
        <div class="d-flex justify-content-between border-top pt-3">
          <b>סכום סופי לתשלום</b>
          <b id="grandTotal">₪0</b>
        </div>

        <!-- כפתור -->
        <button id="submitBtn" class="btn btn-success w-100 mt-4">
          אישור הזמנה
        </button>

        <!-- הודעה אם אין מוצרים -->
        <div id="emptyCart" class="alert alert-warning mt-3 d-none">
          העגלה ריקה.
        </div>

      </div>
    </div>
  </div>

  <!-- פופאפ יפה הודעת alert -->
  <div id="popup" class="popup d-none">
    <div class="popup-box">
      <h3>הזמנה אושרה ✅</h3>
      <p id="popupText"></p>
      <button onclick="closePopup()">אישור</button>
    </div>
  </div>

  <!-- מקשר לדף הפונקציות של הגאווה JS -->
    <script src="/js/data.js"></script>
  <script src="/js/order.js"></script>
  

</body>
</html>
