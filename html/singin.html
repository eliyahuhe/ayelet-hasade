<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>איילת השדה - הרשמה</title>
    <link rel="icon" href="/image/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- שעה וטמפ' -->
    <div class="top-nav">
        <div class="status-bar">
            <span id="current-time">00:00</span>
            <span class="divider">|</span>
            <span id="weather-info">☀️ טוען...</span>
        </div>
    </div>

    <form onsubmit="singin(event)">
        <div class="login-container">
            <div class="login-card">

                <img src="/image/logo.png" alt="איילת השדה" class="logo">
                <h2>יצירת חשבון חדש</h2>

                <div class="input-group">


                    <!-- שם משתמש -->
                    <input type="text" id="username" placeholder="הכנס שם משתמש..." autocomplete="off" required
                        pattern="[A-Za-zא-ת ]+" title="יש להזין אותיות בלבד">

                    <!-- טלפון -->
                    <input type="tel" id="phone" placeholder="מספר טלפון..." autocomplete="tel" required
                        pattern="[0-9]{9,10}" title="יש להזין מספר טלפון תקין (9-10 ספרות)">

                    <!-- סיסמה -->
                    <div class="pass-group">
                        <input type="password" id="password" placeholder="סיסמה..." autocomplete="new-password" required
                            minlength="6">
                        <i class="bi bi-eye-slash" id="togglePassword"
                            onclick="togglePass('password', 'togglePassword')"></i>
                    </div>

                    <!-- אימות סיסמה -->
                    <div class="pass-group">
                        <input type="password" id="confirmPassword" placeholder="אימות סיסמה..."
                            autocomplete="new-password" required minlength="6">
                        <i class="bi bi-eye-slash" id="toggleConfirmPassword"
                            onclick="togglePass('confirmPassword', 'toggleConfirmPassword')"></i>
                    </div>
                </div>

                <!-- כפתור הרשמה -->
                <button type="submit" id="register-btn">הרשמה</button>

                <!-- קישור לחזרה לכניסה -->
                <div class="register-link">
                    <span>כבר יש לך חשבון?</span>
                    <a href="/login.html">להתחברות לחץ כאן</a>
                </div>

            </div>
        </div>
    </form>

    <script src="../js/singin.js"></script>
    <script>
        // פונקציה להצגה/הסתרה של סיסמה (תומכת בשני שדות הסיסמה)
        function togglePass(inputId, iconId) {
            const passInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);

            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleIcon.classList.remove('bi-eye-slash');
                toggleIcon.classList.add('bi-eye');
            } else {
                passInput.type = 'password';
                toggleIcon.classList.remove('bi-eye');
                toggleIcon.classList.add('bi-eye-slash');
            }
        }
    </script>
</body>

</html>
