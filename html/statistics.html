<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>איילת השדה - סטטיסטיקות ודוחות</title>
    <link rel="icon" href="/image/favicon.png">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="bg-light">

    <!-- בר ניווט עליון -->
    <nav class="navbar navbar-main sticky-top shadow-sm" dir="ltr">
        <div class="container-fluid d-flex align-items-center justify-content-between flex-nowrap px-4">
            <div class="text-white d-flex align-items-center gap-2">
                <a href="admin.html" class="text-white text-decoration-none me-3" title="חזרה לתפריט">
                    <i class="bi bi-arrow-left-circle fs-4"></i>
                </a>
                <span id="adminGreeting">שלום, מנהל מערכת</span>
                <i class="bi bi-person-circle fs-4"></i>
            </div>
            <div class="d-flex align-items-center gap-2 logo-container">
                <span class="navbar-brand mb-0 fw-bold fs-4 text-white">איילת השדה - סטטיסטיקות מורחבות</span>
                <img src="/image/logo.png" alt="לוגו" class="rounded-circle border border-white border-1 logo-img">
            </div>
        </div>
    </nav>

    <main class="container mt-4 mb-5">
        
        <!-- כותרת ראשית ואפשרויות סינון -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
            <h3 class="fw-bold text-dark mb-2">דשבורד נתונים</h3>
            
            <div class="d-flex gap-2 align-items-center">
                <label for="timeFilter" class="fw-bold text-nowrap">הצג נתונים לפי:</label>
                <select id="timeFilter" class="form-select w-auto fw-bold" onchange="fetchStatistics()">
                    <option value="today">היום</option>
                    <option value="week" selected>7 ימים אחרונים</option>
                    <option value="month">30 ימים אחרונים</option>
                    <option value="all">כל הזמנים</option>
                </select>
            </div>
        </div>

        <!-- שורה 1: כרטיסיות נתוני על (KPIs) -->
        <div class="row g-3 mb-4">
            <div class="col-md-3 col-sm-6">
                <div class="card shadow-sm border-0 h-100 kpi-card bg-success text-white">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center">
                        <h6 class="card-title mb-2 opacity-75">סה"כ מכירות</h6>
                        <h2 class="fw-bold mb-0" id="totalRevenueBox">₪0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card shadow-sm border-0 h-100 kpi-card bg-primary text-white">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center">
                        <h6 class="card-title mb-2 opacity-75">מספר הזמנות</h6>
                        <h2 class="fw-bold mb-0" id="totalOrdersBox">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card shadow-sm border-0 h-100 kpi-card bg-info text-white">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center">
                        <h6 class="card-title mb-2 opacity-75">ממוצע להזמנה</h6>
                        <h2 class="fw-bold mb-0" id="avgOrderBox">₪0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card shadow-sm border-0 h-100 kpi-card bg-warning text-dark">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center">
                        <h6 class="card-title mb-2 opacity-75">לקוחות רשומים</h6>
                        <h2 class="fw-bold mb-0" id="totalUsersBox">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- שורה 2: גרף מרכזי - מכירות לאורך זמן -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-dark mb-4">הכנסות לפי תאריכים</h5>
                        <div class="chart-container" style="position: relative; height:300px; width:100%">
                            <canvas id="revenueChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- שורה 3: התמקדות במוצרים לגרפים (טופ 5) -->
        <div class="row g-4">
            <!-- צד ימין: עוגת מוצרים -->
            <div class="col-md-5">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-dark mb-4">המוצרים הנמכרים ביותר (באחוזים)</h5>
                        <div class="chart-container" style="position: relative; height:250px; width:100%">
                            <canvas id="topProductsPieChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- צד שמאל: טבלת טופ 5 עמודות -->
            <div class="col-md-7">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-dark mb-4">טופ 5 מוצרים (לפי כמות)</h5>
                        <div class="chart-container" style="position: relative; height:250px; width:100%">
                            <canvas id="topProductsBarChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- שורה 4: טבלת מכירות מלאה לפי מוצר -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-dark mb-4">פירוט מכירות מלא לפי מוצר</h5>
                        <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                            <table class="table table-hover align-middle text-center">
                                <thead class="table-light sticky-top">
                                    <tr>
                                        <th>שם המוצר</th>
                                        <th>כמות שנמכרה</th>
                                        <th>הכנסה כוללת ממוצר זה</th>
                                    </tr>
                                </thead>
                                <tbody id="productsTableBody">
                                    <!-- הנתונים יוזרקו לכאן מה-JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="/JS/statistics.js"></script>
</body>
</html>
