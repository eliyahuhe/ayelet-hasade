<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

<body>


    <!-- בר ראשי -->
    <div class="sticky-top">
        <nav class="navbar" style="background-color:rgb(0, 83, 80);">
            <div class="container-fluid d-flex align-items-center justify-content-between flex-nowrap ms-4">

                <!--  משתמש -->
                <div class="text-white d-flex align-items-center gap-2 ms-4">
                    <span>user name</span>
                    <button style="border:none; background:transparent; color:white;">
                        <i class="bi bi-person-circle fs-4"></i>
                    </button>
                    <!-- עגלה -->
                    <button type="button" class="btn btn-success ms-5"><i class="bi bi-cart4"></i> עגלה</button>

                </div>


                <!-- חיפוש באמצע -->
                <form class="d-flex justify-content-center ms-5" role="search" style="width:350px;">
                    <input id="searchInput" class="form-control rounded-pill me-2" type="search" placeholder="חיפוש מוצר"
                        aria-label="Search" />
                    
                </form>

                <!--  - לוגו + שם חנות -->
                <div class="d-flex align-items-center gap-2 me-5" style="position: relative; right: 20px;">
                    <span class="navbar-brand mb-0 fw-bold fs-4 text-white">
                        איילת השדה
                    </span>
                    <img src="image/logo.png" class="rounded-circle border border-white border-1"
                        style="width:50px; height:50px; object-fit:cover;">
                </div>

            </div>
            <!--בר משנה-->
        </nav>
        <nav class="navbar navbar-expand-lg bg-light border-top border-bottom">
            <div class="container justify-content-center ">

                <ul class="navbar-nav flex-row gap-3">

                    <li class="nav-item">
                        <a class="nav-link category-btn text-success" href="#" onclick="setNavBtn(this); filterproducts('sale')">מבצעים</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link category-btn text-success" href="#" onclick="setNavBtn(this); filterproducts('vegetables')">ירקות</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link category-btn text-success" href="#" onclick="setNavBtn(this); filterproducts('fruits')">פירות</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link category-btn active fw-bold text-success" href="#" onclick="setNavBtn(this); filterproducts('all')">כל המוצרים</a>
                    </li>

                </ul>

            </div>
        </nav>
    </div>

    <main class="container mt-5" dir="rtl">
        <div class="row">
            <!--כרטיסים -->
            <div class="col-lg-9">
                <div class="row g-4 justify-content-start" id="productsContainer">


                </div>
            </div>
            <!--  העגלה -->
            <div class="col-lg-3">
                <div class="card position-sticky bg-white " style="
         top:150px;
         width:105%;

         border:2px solid rgb(0, 83, 80);
         border-radius:14px;
         box-shadow: 0 10px 25px rgba(0,0,0,0.10);
         overflow:hidden ;
       ">

                    <!-- כותרת + סכום -->
                    <div class="p-3" style="border-bottom:1px solid rgba(0,0,0,0.06);">

                        <div class="fw-bold" style="color:rgb(0,83,80);">
                            סל הקניות שלי
                        </div>

                        <div class="d-flex align-items-end justify-content-between mt-2">
                            <div class="text-muted small">סה״כ לתשלום</div>
                            <div class="fw-bold fs-4" style="color:rgb(0,83,80);">
                                <span id=CartSum>₪0.00</span>
                            </div>
                        </div>

                    </div>

                    <div class="card-body p-4 d-flex flex-column" style="min-height:380px;">

                        <!-- מצב ריק -->
                        <div class="flex-grow-1 d-flex align-items-center justify-content-center">
                            <div class="text-center">
                                <i class="bi bi-cart-x" style="font-size:48px; color:rgb(0,83,80);"></i>
                                <div class="fw-semibold mt-2">
                                    סל הקניות שלכם ריק
                                </div>
                                <div class="text-muted small">
                                    התחילו להוסיף מוצרים
                                </div>
                            </div>
                        </div>

                        <!-- כפתור -->
                        <button class="btn w-100 rounded-3 fw-semibold" style="background:rgb(0,83,80); color:#fff;">
                            המשך לתשלום
                        </button>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-5" style="background: rgb(30, 120, 100); color: white;">
        <div class="container py-4">

            <div class="row text-center text-md-end">


                <!-- צד שמאל - יצירת קשר -->
                <div class="col-md-4 mb-3">
                    <p class="small mb-1">📞 03-1234567</p>
                    <p class="small mb-1">✉️ info@ayelet.co.il</p>
                    <p class="small mb-0">א׳–ה׳ 08:00–18:00</p>
                </div>

                <!-- אמצע - קישורים -->
                <div class="col-md-4 mb-3">
                    <div class="d-flex flex-column gap-1 small">
                        <a href="#" class="text-white text-decoration-none">כל המוצרים</a>
                        <a href="#" class="text-white text-decoration-none">מבצעים</a>
                        <a href="#" class="text-white text-decoration-none">ירקות</a>
                        <a href="#" class="text-white text-decoration-none">פירות</a>
                    </div>
                </div>



                <!-- צד ימין - לוגו + שם -->
                <div
                    class="col-md-4 mb-3 d-flex align-items-center justify-content-md-end justify-content-center gap-2">

                    <span class="fw-bold fs-5">
                        איילת השדה
                    </span>

                    <img src="image/logo.png" style="width:90px; height:90px; object-fit:cover;"
                        class="rounded-circle border border-white">
                </div>

            </div>

            <hr class="border-light my-3">

            <div class="text-center small">
                © 2026 איילת השדה
            </div>

        </div>
    </footer>
    <script src="JS/data.js"></script>
    <script src="JS/shop.js"></script>


</body>

</html>
